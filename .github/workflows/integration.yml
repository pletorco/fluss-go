name: Fluss 0.9.1 Integration

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '31 2 * * 3'

concurrency:
  group: fluss-0.9.1-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    name: Fluss 0.9.1 live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          check-latest: true
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.51.1
      - run: task test:integration
      - name: Retain reliability smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reliability-smoke-${{ github.run_id }}
          path: .task/reliability/smoke.json
          if-no-files-found: error
          retention-days: 14
