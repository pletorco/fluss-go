name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Go release only proves build and test
          # compatibility. Go-independent gates run once, on the newest release.
          - go: 1.25.x
            target: ci:compat
          - go: 1.26.x
            target: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: '**/go.sum'
      - name: Install protoc 3.21.12
        if: matrix.target == 'ci'
        env:
          PROTOC_SHA256: 3a4c1e5f2516c639d3079b1586e703fc7bcfa2136d58bda24d1d54f949c315e8
        run: |
          archive="$RUNNER_TEMP/protoc-21.12-linux-x86_64.zip"
          install_dir="$RUNNER_TEMP/protoc"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          echo "$PROTOC_SHA256  $archive" | sha256sum --check
          unzip -q "$archive" -d "$install_dir"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          "$install_dir/bin/protoc" --version
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.51.1
      - if: matrix.target == 'ci'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - name: Run CI
        run: >-
          task --output group
          --output-group-begin '::group::{{.TASK}}'
          --output-group-end '::endgroup::'
          --color=false
          ${{ matrix.target }}
