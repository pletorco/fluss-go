name: fluss-go-storage-integration

x-hadoop-image: &hadoop-image apache/hadoop@sha256:127774dadab40ce84df7ac668a7a8c99945688b3fe336f1388f4477ca33e1529
x-hadoop-environment: &hadoop-environment
  CORE-SITE.XML_fs.defaultFS: hdfs://hdfs-namenode:8020
  HDFS-SITE.XML_dfs.namenode.rpc-address: hdfs-namenode:8020
  HDFS-SITE.XML_dfs.replication: "1"
  HDFS-SITE.XML_dfs.permissions.enabled: "false"

services:
  rustfs:
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    command: /data
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      RUSTFS_ACCESS_KEY: ${FLUSS_STORAGE_S3_ACCESS_KEY:?set by integration/storage/run.sh}
      RUSTFS_SECRET_KEY: ${FLUSS_STORAGE_S3_SECRET_KEY:?set by integration/storage/run.sh}
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "127.0.0.1:${FLUSS_STORAGE_S3_PORT:-19000}:9000"
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 3s
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9000/health"]
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0750

  hdfs-namenode:
    image: *hadoop-image
    command: ["hdfs", "namenode"]
    hostname: hdfs-namenode
    restart: "no"
    environment:
      <<: *hadoop-environment
      ENSURE_NAMENODE_DIR: /tmp/hadoop-hadoop/dfs/name
    healthcheck:
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get >/dev/null 2>&1"]
    tmpfs:
      - /tmp/hadoop-hadoop

  hdfs-datanode:
    image: *hadoop-image
    command: ["hdfs", "datanode"]
    hostname: hdfs-datanode
    restart: "no"
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    environment:
      <<: *hadoop-environment
    healthcheck:
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9864'"]
    tmpfs:
      - /tmp/hadoop-hadoop
