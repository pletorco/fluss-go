version: '3'

output: prefixed

set:
  - errexit
  - nounset
  - pipefail

vars:
  FLUSS_VERSION: 0.9.1-incubating
  FLUSS_COMMIT: 6bf969f71af8d6f9cc37383ab89ae46a58b0e227
  FUZZ_ITERATIONS: 1000
  FUZZ_PARALLELISM: 1
  GO_PACKAGES:
    sh: go list ./... 2>/dev/null || true
  MODULES: . adapters/hdfs adapters/oss adapters/otel adapters/s3
  APIDIFF_VERSION: v0.0.0-20260112195511-716be5621a96
  GOVULNCHECK_VERSION: v1.6.0
  PROTOC_VERSION: 3.21.12
  PROTOC_GEN_GO_VERSION: v1.36.10
  TRIVY_VERSION: 0.72.0
  LICENSE_ALLOWLIST: Apache-2.0,BSD-2-Clause,BSD-3-Clause,MIT,Copyright
  TOOLS_DIR: .tools/bin

tasks:
  default:
    desc: List available project tasks
    cmds:
      - task --list

  fmt:
    desc: Format tracked Go files
    cmds:
      - test -z "$(git ls-files '*.go')" || gofmt -w $(git ls-files '*.go')

  fmt:check:
    desc: Verify Go files are formatted
    cmds:
      - test -z "$(git ls-files '*.go')" || test -z "$(gofmt -l $(git ls-files '*.go'))"

  deps:verify:
    desc: Verify Go module dependencies
    cmds:
      - for: { var: MODULES }
        cmd: go -C {{.ITEM}} mod verify

  vet:
    desc: Run go vet
    cmds:
      - for: { var: MODULES }
        cmd: go -C {{.ITEM}} vet ./...

  docs:check:
    desc: Verify GoDoc, Markdown links, and compile-checked examples
    deps:
      - docs:examples:compile
      - docs:examples:run
      - docs:markdown
      - docs:snippets:compile
    cmds:
      - go run ./cmd/doccheck ./pkg/fmsg ./pkg/fgo ./pkg/fadm ./adapters/s3 ./adapters/oss ./adapters/hdfs ./adapters/otel
      - go doc ./pkg/fmsg >/dev/null
      - go doc ./pkg/fgo >/dev/null
      - go doc ./pkg/fadm >/dev/null
      - go doc ./adapters/s3 >/dev/null
      - go doc ./adapters/oss >/dev/null
      - go doc ./adapters/hdfs >/dev/null
      - go doc ./adapters/otel >/dev/null

  api:check:
    desc: Reject unreviewed exported API changes
    deps:
      - api:check:client
      - api:check:protocol
      - api:check:adapters

  api:check:client:
    desc: Compare fgo and fadm with the reviewed API baseline
    cmds:
      - task: api:compare
        vars: { PACKAGE: ./pkg/fgo, BASELINE: api/baselines/fgo.api }
      - task: api:compare
        vars: { PACKAGE: ./pkg/fadm, BASELINE: api/baselines/fadm.api }

  api:check:protocol:
    desc: Compare fmsg with its separately reviewed generated protocol baseline
    cmds:
      - task: api:compare
        vars: { PACKAGE: ./pkg/fmsg, BASELINE: api/baselines/fmsg.api }

  api:check:adapters:
    desc: Compare separately versioned adapter modules with reviewed baselines
    cmds:
      - task: api:compare
        vars: { PACKAGE: ./adapters/hdfs, BASELINE: api/baselines/adapter-hdfs.api }
      - task: api:compare
        vars: { PACKAGE: ./adapters/oss, BASELINE: api/baselines/adapter-oss.api }
      - task: api:compare
        vars: { PACKAGE: ./adapters/otel, BASELINE: api/baselines/adapter-otel.api }
      - task: api:compare
        vars: { PACKAGE: ./adapters/s3, BASELINE: api/baselines/adapter-s3.api }

  api:compare:
    internal: true
    requires:
      vars: [PACKAGE, BASELINE]
    cmds:
      - >-
        output="$(go run golang.org/x/exp/cmd/apidiff@{{.APIDIFF_VERSION}}
        {{.BASELINE}} {{.PACKAGE}})";
        if test -n "$output"; then
          printf '%s\n' "$output";
          printf 'exported API differs from %s; review the change and run task api:update\n' {{.BASELINE}} >&2;
          exit 1;
        fi

  api:update:
    desc: Update all exported API baselines after an approved API review
    cmds:
      - mkdir -p api/baselines
      - go run golang.org/x/exp/cmd/apidiff@{{.APIDIFF_VERSION}} -w api/baselines/fgo.api ./pkg/fgo
      - go run golang.org/x/exp/cmd/apidiff@{{.APIDIFF_VERSION}} -w api/baselines/fadm.api ./pkg/fadm
      - go run golang.org/x/exp/cmd/apidiff@{{.APIDIFF_VERSION}} -w api/baselines/fmsg.api ./pkg/fmsg
      - go run golang.org/x/exp/cmd/apidiff@{{.APIDIFF_VERSION}} -w api/baselines/adapter-hdfs.api ./adapters/hdfs
      - go run golang.org/x/exp/cmd/apidiff@{{.APIDIFF_VERSION}} -w api/baselines/adapter-oss.api ./adapters/oss
      - go run golang.org/x/exp/cmd/apidiff@{{.APIDIFF_VERSION}} -w api/baselines/adapter-otel.api ./adapters/otel
      - go run golang.org/x/exp/cmd/apidiff@{{.APIDIFF_VERSION}} -w api/baselines/adapter-s3.api ./adapters/s3

  docs:markdown:
    desc: Verify local Markdown links, anchors, and synchronized Go fences
    cmds:
      - go run ./cmd/mdcheck .

  docs:snippets:compile:
    desc: Compile Markdown Go snippet sources without live-cluster execution
    cmds:
      - echo "Compiling Markdown snippets only; live Fluss workflows are not executed."
      - go test ./internal/docexamples -run '^$'

  docs:snippets:sync:
    desc: Update Markdown Go fences from compile-checked sources
    cmds:
      - go run ./cmd/mdcheck -write .

  docs:examples:compile:
    desc: Compile all pkg.go.dev examples, including live-cluster workflows
    cmds:
      - echo "Compiling pkg.go.dev examples only; live Fluss workflows are not executed."
      - go test ./pkg/fmsg ./pkg/fgo ./pkg/fadm ./adapters/s3 ./adapters/oss ./adapters/hdfs ./adapters/otel -run '^$'

  docs:examples:run:
    desc: Execute deterministic pkg.go.dev examples with expected output
    cmds:
      - echo "Executing deterministic pkg.go.dev examples with Output directives."
      - go test -v ./pkg/fmsg ./pkg/fgo ./pkg/fadm ./adapters/s3 ./adapters/oss ./adapters/hdfs ./adapters/otel -run '^Example'

  test:
    desc: Run the complete fast test suite
    deps:
      - test:unit
      - test:golden

  test:unit:
    desc: Run unit tests
    cmds:
      - for: { var: MODULES }
        cmd: go -C {{.ITEM}} test ./...

  test:golden:
    desc: Verify byte-level Fluss 0.9.1 compatibility fixtures
    cmds:
      - go test ./pkg/fmsg -run '^TestProtocolGoldenBytes$'
      - >-
        go test ./pkg/fgo
        -run '^Test(CompactedPrimaryKeyMatchesJavaFixture|RowsMatchJava091Fixtures|KVAndLogBatchesMatchJava091Fixtures|LogBatchEncodesV0AndV1Headers|ArrowLogBatchDecodesJava091Fixture|FlussBucketMatchesJava091)$'

  test:race:
    desc: Run unit tests with the race detector
    cmds:
      - for: { var: MODULES }
        cmd: go -C {{.ITEM}} test -race ./...

  test:fuzz:
    desc: Run bounded parser and codec fuzz smoke tests
    cmds:
      - go test -run '^$' -fuzz '^FuzzHandleFrame$' -fuzztime={{.FUZZ_ITERATIONS}}x -parallel={{.FUZZ_PARALLELISM}} ./internal/transport
      - go test -run '^$' -fuzz '^FuzzResponseUnmarshal$' -fuzztime={{.FUZZ_ITERATIONS}}x -parallel={{.FUZZ_PARALLELISM}} ./pkg/fmsg
      - go test -run '^$' -fuzz '^FuzzParseLogicalTypeJSON$' -fuzztime={{.FUZZ_ITERATIONS}}x -parallel={{.FUZZ_PARALLELISM}} ./pkg/fgo
      - go test -run '^$' -fuzz '^FuzzDecodeCompactedRow$' -fuzztime={{.FUZZ_ITERATIONS}}x -parallel={{.FUZZ_PARALLELISM}} ./pkg/fgo
      - go test -run '^$' -fuzz '^FuzzDecodeIndexedRow$' -fuzztime={{.FUZZ_ITERATIONS}}x -parallel={{.FUZZ_PARALLELISM}} ./pkg/fgo
      - go test -run '^$' -fuzz '^FuzzLookupKeyEncoding$' -fuzztime={{.FUZZ_ITERATIONS}}x -parallel={{.FUZZ_PARALLELISM}} ./pkg/fgo
      - go test -run '^$' -fuzz '^FuzzDecodeKVBatch$' -fuzztime={{.FUZZ_ITERATIONS}}x -parallel={{.FUZZ_PARALLELISM}} ./pkg/fgo
      - go test -run '^$' -fuzz '^FuzzDecodeLogBatchRows$' -fuzztime={{.FUZZ_ITERATIONS}}x -parallel={{.FUZZ_PARALLELISM}} ./pkg/fgo
      - go test -run '^$' -fuzz '^FuzzDecodeArrowLogBatch$' -fuzztime={{.FUZZ_ITERATIONS}}x -parallel={{.FUZZ_PARALLELISM}} ./pkg/fgo

  coverage:
    desc: Verify 80 percent coverage for every hand-written Go source file
    deps:
      - coverage:generate
    cmds:
      - cmd: >-
          awk 'NR > 1 && $1 !~ /FlussApi\.pb\.go|api_keys_gen\.go/ { split($1, path, ":"); total[path[1]] += $2; if ($3 > 0) covered[path[1]] += $2 } END { failed = 0; for (file in total) { percent = 100 * covered[file] / total[file]; printf "%s: %.1f%% (%d/%d statements)\n", file, percent, covered[file], total[file]; if (percent < 80) failed = 1 } exit failed }' coverage.out

  coverage:generate:
    desc: Generate one coverage profile across the root and adapter modules
    cmds:
      - mkdir -p .task/coverage
      - go test -coverprofile=.task/coverage/root.out ./...
      - go -C adapters/hdfs test -coverprofile=../../.task/coverage/hdfs.out ./...
      - go -C adapters/oss test -coverprofile=../../.task/coverage/oss.out ./...
      - go -C adapters/otel test -coverprofile=../../.task/coverage/otel.out ./...
      - go -C adapters/s3 test -coverprofile=../../.task/coverage/s3.out ./...
      - >-
        awk 'FNR == 1 && NR != 1 { next } { print }'
        .task/coverage/root.out .task/coverage/hdfs.out
        .task/coverage/oss.out .task/coverage/otel.out
        .task/coverage/s3.out > coverage.out

  test:integration:
    desc: Run live tests against pinned plaintext, SASL, and TLS-terminated Fluss 0.9.1 clusters
    preconditions:
      - sh: command -v docker >/dev/null 2>&1
        msg: Docker is required for the Fluss integration environment.
      - sh: docker compose version >/dev/null 2>&1
        msg: Docker Compose is required for the Fluss integration environment.
      - sh: command -v openssl >/dev/null 2>&1
        msg: OpenSSL is required to generate ephemeral SASL credentials.
    cmds:
      - ./integration/run.sh

  test:reliability:
    desc: Run one configurable reliability profile against pinned Fluss 0.9.1
    preconditions:
      - sh: command -v docker >/dev/null 2>&1
        msg: Docker is required for the Fluss reliability environment.
      - sh: docker compose version >/dev/null 2>&1
        msg: Docker Compose is required for the Fluss reliability environment.
      - sh: command -v openssl >/dev/null 2>&1
        msg: OpenSSL is required by the shared live runner.
    env:
      FLUSS_RELIABILITY_ONLY: '1'
    cmds:
      - ./integration/run.sh

  test:s3:
    desc: Run the AWS SDK adapter against a reproducible MinIO service
    preconditions:
      - sh: command -v docker >/dev/null 2>&1
        msg: Docker is required for the S3 service environment.
      - sh: docker compose version >/dev/null 2>&1
        msg: Docker Compose is required for the S3 service environment.
    cmds:
      - ./integration/storage/run.sh s3

  test:s3:managed:
    desc: Run the read-only S3 adapter test against an application-managed service
    cmds:
      - go test -v ./adapters/s3 -run '^TestS3AdapterLive$'

  test:oss:
    desc: Run the opt-in official Alibaba Cloud OSS SDK adapter service test
    cmds:
      - go test -v ./adapters/oss -run '^TestOSSAdapterLive$'

  test:hdfs:
    desc: Run the HDFS adapter boundary against reproducible Apache Hadoop
    preconditions:
      - sh: command -v docker >/dev/null 2>&1
        msg: Docker is required for the HDFS service environment.
      - sh: docker compose version >/dev/null 2>&1
        msg: Docker Compose is required for the HDFS service environment.
    cmds:
      - ./integration/storage/run.sh hdfs

  test:hdfs:mounted:
    desc: Run the opt-in HDFS adapter test against an application-mounted file
    cmds:
      - go test -v ./adapters/hdfs -run '^TestHDFSAdapterLive$'

  test:storage:
    desc: Run reproducible S3 and HDFS service integration tests
    preconditions:
      - sh: command -v docker >/dev/null 2>&1
        msg: Docker is required for the storage service environment.
      - sh: docker compose version >/dev/null 2>&1
        msg: Docker Compose is required for the storage service environment.
    cmds:
      - ./integration/storage/run.sh all

  sonar:
    desc: Generate coverage and submit a local SonarQube analysis
    preconditions:
      - sh: test -f .env
        msg: A local .env file with SONAR_HOST_URL and SONAR_TOKEN is required.
      - sh: test -f sonar-project.properties
        msg: sonar-project.properties is required.
      - sh: command -v sonar-scanner >/dev/null 2>&1
        msg: Install SonarScanner CLI and make sonar-scanner available on PATH.
    cmds:
      - task: coverage:generate
      - cmd: |
          set -a
          . ./.env
          set +a
          test -n "$SONAR_HOST_URL"
          test -n "$SONAR_TOKEN"
          sonar-scanner \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.issue.ignore.multicriteria=testCognitiveComplexity \
            -Dsonar.issue.ignore.multicriteria.testCognitiveComplexity.ruleKey=go:S3776 \
            '-Dsonar.issue.ignore.multicriteria.testCognitiveComplexity.resourceKey=**/*_test.go'

  generate:
    desc: Regenerate protocol artifacts
    deps:
      - generate:protocol

  generate:protocol:
    desc: Regenerate pinned Apache Fluss protocol metadata
    preconditions:
      - sh: command -v protoc >/dev/null 2>&1
        msg: Install protoc {{.PROTOC_VERSION}} and make it available on PATH.
      - sh: test "$(protoc --version)" = "libprotoc {{.PROTOC_VERSION}}"
        msg: protoc {{.PROTOC_VERSION}} is required for reproducible protocol generation.
    cmds:
      - mkdir -p "{{.TOOLS_DIR}}"
      - GOBIN="$(pwd)/{{.TOOLS_DIR}}" go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
      - go run ./cmd/protocolgen
      - PATH="$(pwd)/{{.TOOLS_DIR}}:$PATH" protoc --go_out=pkg/fmsg --go_opt=module=github.com/pletorco/fluss-go/pkg/fmsg --go_opt=Mthird_party/apache-fluss/FlussApi.proto=github.com/pletorco/fluss-go/pkg/fmsg third_party/apache-fluss/FlussApi.proto

  verify:generate:
    desc: Verify generated protocol artifacts are current
    cmds:
      - task: generate
      - git diff --exit-code -- pkg/fmsg/FlussApi.pb.go pkg/fmsg/api_keys_gen.go

  tools:check:
    desc: Check required security tool versions
    cmds:
      - test "$(trivy version | awk '/^Version:/ { print $2; exit }')" = "{{.TRIVY_VERSION}}"

  security:go:
    desc: Scan Go dependencies with govulncheck
    cmds:
      - mkdir -p "{{.TOOLS_DIR}}"
      - GOBIN="$(pwd)/{{.TOOLS_DIR}}" go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}
      - for: { var: MODULES }
        cmd: '"{{.ROOT_DIR}}/{{.TOOLS_DIR}}/govulncheck" ./...'
        dir: '{{.ITEM}}'

  security:repo:
    desc: Scan repository vulnerabilities, configuration, and secrets
    deps:
      - tools:check
    cmds:
      - trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --no-progress .
      - trivy fs --scanners secret --exit-code 1 --no-progress .

  security:licenses:
    desc: Reject dependencies outside the reviewed license allowlist
    deps:
      - tools:check
    cmds:
      - >-
        trivy fs --scanners license
        --ignored-licenses {{.LICENSE_ALLOWLIST}}
        --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        --skip-dirs testdata/license-policy-denied
        --exit-code 1 --no-progress .
      - task: security:licenses:test-policy

  security:licenses:test-policy:
    internal: true
    cmds:
      - >-
        if trivy fs --scanners license
        --ignored-licenses {{.LICENSE_ALLOWLIST}}
        --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        --exit-code 1 --no-progress
        testdata/license-policy-denied >/dev/null 2>&1; then
          printf 'license policy canary unexpectedly passed\n' >&2;
          exit 1;
        fi

  security:
    desc: Run all local security gates
    deps:
      - deps:verify
      - security:go
      - security:licenses
      - security:repo

  verify:
    desc: Run all local pre-PR validation and security gates
    deps:
      - api:check
      - docs:check
      - fmt:check
      - verify:generate
      - vet
      - test
      - test:race
      - coverage
      - security
    cmds:
      - task: test:fuzz

  ci:
    desc: Run the CI verification suite
    deps:
      - verify
